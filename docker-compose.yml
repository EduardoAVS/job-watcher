services:
  postgres:
    image: postgres:16
    container_name: jobwatcher-postgres
    environment:
      POSTGRES_DB: jobwatcher
      POSTGRES_USER: jobwatcher
      POSTGRES_PASSWORD: jobwatcher
    ports:
      - "5433:5432"
    volumes:
      - jobwatcher_postgres_data:/var/lib/postgresql/data

volumes:
  jobwatcher_postgres_data: